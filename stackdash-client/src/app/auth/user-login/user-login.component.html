        <title>StackDash Login</title>

        <video autoplay muted loop id="bg-video">
            <source src="../login3.mp4" type="video/mp4" />
            Your browser does not support the video tag.
        </video>
        <div class="video-overlay"> </div>
        
        
<div class="login-container ">

  <div class="logo">
<img class="logo-img" src="logo3.png" alt="StackDash Logo" style="height: 75px;">
</div>

  <div *ngIf="errorMessage" class="error" >
          <p>{{ errorMessage }}</p>
          
        </div>

        <div *ngIf="successMessage" id="success-message">
          {{ successMessage }}
        </div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <h2 style="color: rgb(7, 71, 114);">Login</h2>

    <input type="text" formControlName="userName" placeholder="Your username">
    <div  *ngIf="submitted && loginForm.get('userName')?.errors">
      <small class="error" *ngIf="submitted && loginForm.get('userName')?.errors?.['required']"> Email is required.</small>
    </div>
    <input type="password" formControlName="password" placeholder="Your  password">
    <div *ngIf="submitted && loginForm.get('password')?.errors">
      <small class="error" *ngIf="submitted && loginForm.get('password')?.errors?.['required']">Password is required</small>
    </div>
  
    <button class="button-login" type="submit">Login</button>
  </form>

  <a routerLink="/forgot-password"> Forgot Password?</a>

  <h4 id="or">OR</h4>

  <button type='submit' (click)="registerUser()" >Register</button>
</div>
