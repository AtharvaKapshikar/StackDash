<div class="notification-container">
          <div class="top-grid">
                <div class="grid-top">
                    <h3>Notifications</h3>

<p>{{errorMsg}}</p>

  <div class="notification-card" *ngFor="let notif of notification">
    <div class="message">{{ notif.message }}</div>
    <div class="timestamp">{{ notif.timestamp | date: 'short' }}</div>
  </div>
  </div>
  </div>
</div>
